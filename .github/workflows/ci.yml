name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip check
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke
        run: fin-evidence --data data demo > /tmp/demo.txt && grep -q "pass_with_restatement" /tmp/demo.txt
      - name: MCP stdio smoke
        run: python scripts/smoke_mcp.py
